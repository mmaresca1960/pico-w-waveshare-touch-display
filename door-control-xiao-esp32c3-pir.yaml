esphome:
  name: door-control-c3
  friendly_name: Door Control C3
  min_version: 2026.7.2
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - light.turn_on: display_backlight
      - component.update: my_display
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 15s
      - component.update: my_display
  on_shutdown:
    then:
      - light.turn_off: display_backlight

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      # GPIO wake otherwise adds an internal pull-down during deep sleep,
      # which loads this PIR's high-impedance output down to about 1.8 V.
      CONFIG_ESP_SLEEP_GPIO_ENABLE_INTERNAL_RESISTORS: "n"

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  id: api_server
  on_client_connected:
    - component.update: my_display
  on_client_disconnected:
    - component.update: my_display

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: i2c_bus0
    sda: GPIO6
    scl: GPIO7
    frequency: 400kHz
    scan: true

spi:
  - id: spi_bus0
    clk_pin: GPIO8
    mosi_pin: GPIO10
    miso_pin: GPIO9

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  # Assumes an active-HIGH PIR output.
  # D1/GPIO3 can wake the XIAO ESP32-C3 from deep sleep.
  - platform: gpio
    id: pir_motion
    name: "PIR Motion"
    device_class: motion
    pin:
      number: GPIO3
      allow_other_uses: true
      mode:
        input: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 30s
    on_press:
      - logger.log:
          level: INFO
          tag: power
          format: "PIR motion detected; keeping display awake"
      - deep_sleep.prevent: deep_sleep_control
      - light.turn_on: display_backlight
      - component.update: my_display
    on_release:
      - logger.log:
          level: INFO
          tag: power
          format: "PIR has been clear for 30 seconds; entering deep sleep"
      - deep_sleep.allow: deep_sleep_control
      - light.turn_off: display_backlight
      - delay: 250ms
      - deep_sleep.enter: deep_sleep_control

  - platform: touchscreen
    id: open_door_button
    touchscreen_id: my_touch
    x_min: 0
    x_max: 239
    y_min: 0
    y_max: 159
    internal: true
    on_press:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - logger.log:
                level: INFO
                tag: touch_action
                format: "Open Door pressed; requesting script.open_door"
            - homeassistant.action:
                action: script.open_door
          else:
            - logger.log:
                level: WARN
                tag: touch_action
                format: "Open Door ignored; Home Assistant API is not connected"
      - component.update: my_display
    on_release:
      - component.update: my_display

  - platform: touchscreen
    id: leave_home_button
    touchscreen_id: my_touch
    x_min: 0
    x_max: 239
    y_min: 160
    y_max: 319
    internal: true
    on_press:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - logger.log:
                level: INFO
                tag: touch_action
                format: "Leave Home pressed; requesting script.leave_house"
            - homeassistant.action:
                action: script.leave_house
          else:
            - logger.log:
                level: WARN
                tag: touch_action
                format: "Leave Home ignored; Home Assistant API is not connected"
      - component.update: my_display
    on_release:
      - component.update: my_display

font:
  - file: "fonts/ocraext.ttf"
    id: font_button
    size: 24

touchscreen:
  - platform: cst816
    id: my_touch
    display: my_display
    skip_probe: true
    interrupt_pin:
      number: GPIO21
      mode: INPUT_PULLUP
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch registered at X=%d, Y=%d", touch.x, touch.y);

output:
  - platform: gpio
    id: display_backlight_output
    pin: GPIO20

light:
  - platform: binary
    id: display_backlight
    name: "Display Backlight"
    internal: true
    output: display_backlight_output
    restore_mode: ALWAYS_OFF

display:
  - platform: st7789v
    id: my_display
    model: Custom
    width: 240
    height: 320
    offset_width: 0
    offset_height: 0
    cs_pin: GPIO4
    dc_pin: GPIO5
    reset_pin: GPIO2
    data_rate: 40MHz
    eightbitcolor: true
    rotation: 0
    update_interval: never
    show_test_card: false
    lambda: |-
      const bool ha_ready = id(api_server).is_connected();
      const auto blue = !ha_ready
                          ? Color(55, 65, 81)
                          : id(open_door_button).state
                              ? Color(59, 130, 246)
                              : Color(29, 78, 216);
      const auto red = !ha_ready
                         ? Color(75, 85, 99)
                         : id(leave_home_button).state
                             ? Color(248, 113, 113)
                             : Color(185, 28, 28);
      const auto white = Color(255, 255, 255);
      const auto text = ha_ready ? white : Color(156, 163, 175);

      it.filled_rectangle(0, 0, 240, 160, blue);
      it.filled_rectangle(0, 160, 240, 160, red);

      it.line(0, 159, 239, 159, white);
      it.line(0, 160, 239, 160, white);

      if (ha_ready && id(open_door_button).state) {
        it.rectangle(2, 2, 236, 156, white);
        it.rectangle(3, 3, 234, 154, white);
      }

      if (ha_ready && id(leave_home_button).state) {
        it.rectangle(2, 162, 236, 156, white);
        it.rectangle(3, 163, 234, 154, white);
      }

      it.print(120, 62, id(font_button), text, TextAlign::CENTER, "OPEN");
      it.print(120, 94, id(font_button), text, TextAlign::CENTER, "DOOR");
      it.print(120, 222, id(font_button), text, TextAlign::CENTER, "LEAVE");
      it.print(120, 254, id(font_button), text, TextAlign::CENTER, "HOME");

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  wakeup_pin:
    number: GPIO3
    allow_other_uses: true
    mode:
      input: true
  wakeup_pin_mode: KEEP_AWAKE
