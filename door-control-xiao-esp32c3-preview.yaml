esphome:
  name: door-control-c3
  friendly_name: Door Control C3
  min_version: 2026.7.2
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - component.update: my_display

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: i2c_bus0
    sda: GPIO6
    scl: GPIO7
    frequency: 400kHz
    scan: true

spi:
  - id: spi_bus0
    clk_pin: GPIO8
    mosi_pin: GPIO10
    miso_pin: GPIO9

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: touchscreen
    id: open_door_button
    touchscreen_id: my_touch
    x_min: 0
    x_max: 119
    y_min: 0
    y_max: 319
    internal: true
    on_press:
      - logger.log:
          level: INFO
          tag: touch_action
          format: "Open Door pressed; requesting script.open_door"
      - homeassistant.action:
          action: script.open_door
      - component.update: my_display
    on_release:
      - component.update: my_display

  - platform: touchscreen
    id: leave_home_button
    touchscreen_id: my_touch
    x_min: 120
    x_max: 239
    y_min: 0
    y_max: 319
    internal: true
    on_press:
      - logger.log:
          level: INFO
          tag: touch_action
          format: "Leave Home pressed; requesting script.leave_house"
      - homeassistant.action:
          action: script.leave_house
      - component.update: my_display
    on_release:
      - component.update: my_display

font:
  - file: "fonts/ocraext.ttf"
    id: font_button
    size: 24

touchscreen:
  - platform: cst816
    id: my_touch
    display: my_display
    skip_probe: true
    interrupt_pin:
      number: GPIO21
      mode: INPUT_PULLUP
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch registered at X=%d, Y=%d", touch.x, touch.y);

display:
  - platform: st7789v
    id: my_display
    model: Custom
    width: 240
    height: 320
    offset_width: 0
    offset_height: 0
    cs_pin: GPIO4
    dc_pin: GPIO5
    reset_pin: GPIO2
    backlight_pin: GPIO20
    data_rate: 40MHz
    eightbitcolor: true
    rotation: 0
    update_interval: never
    show_test_card: false
    lambda: |-
      const auto blue = id(open_door_button).state
                          ? Color(59, 130, 246)
                          : Color(29, 78, 216);
      const auto red = id(leave_home_button).state
                         ? Color(248, 113, 113)
                         : Color(185, 28, 28);
      const auto white = Color(255, 255, 255);

      it.filled_rectangle(0, 0, 120, 320, blue);
      it.filled_rectangle(120, 0, 120, 320, red);

      it.line(119, 0, 119, 319, white);
      it.line(120, 0, 120, 319, white);

      if (id(open_door_button).state) {
        it.rectangle(2, 2, 116, 316, white);
        it.rectangle(3, 3, 114, 314, white);
      }

      if (id(leave_home_button).state) {
        it.rectangle(122, 2, 116, 316, white);
        it.rectangle(123, 3, 114, 314, white);
      }

      it.print(60, 142, id(font_button), white, TextAlign::CENTER, "OPEN");
      it.print(60, 174, id(font_button), white, TextAlign::CENTER, "DOOR");
      it.print(180, 142, id(font_button), white, TextAlign::CENTER, "LEAVE");
      it.print(180, 174, id(font_button), white, TextAlign::CENTER, "HOME");
